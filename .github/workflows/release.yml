name: Release

# Installed copies only update when VERSION changes, so pushing app changes
# without bumping it ships nothing. Rather than rely on remembering, this bumps
# the patch version for you — and regenerates frames/ from sprite.js in the same
# commit, so forgetting `node build.js` can't ship new code with stale art.
#
# Runs on macOS so it can actually COMPILE Buddy.swift before releasing:
# every user's machine builds this exact source via install.sh, so a release
# that doesn't compile bricks every auto-update until the next push.
#
# Docs- and website-only pushes are deliberately not listed below: they'd
# otherwise restart every user's buddy to deliver a typo fix.

on:
  push:
    branches: [main]
    paths:
      - Buddy.swift
      - sprite.js
      - build.js
      - png.js
      - frames/**
      - lines.txt
      - install.sh
      - update.sh
      - hooks.sh
      - state.sh
      - session-event.py
      - build-site.js
      - build-mac.sh
      - tests/**
      - uninstall.sh

permissions:
  contents: write

# One release at a time, in order. Without this, two quick pushes race: the
# earlier run's bump commit collides with the later push and one release is
# silently lost.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The bump commit touches frames/ and VERSION, which would retrigger this
    # workflow. Ignoring our own pushes is what stops it looping.
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile check
        run: swiftc -O Buddy.swift -o /tmp/buddy-ci

      - name: Shell syntax check
        run: for f in install.sh update.sh hooks.sh state.sh uninstall.sh; do sh -n "$f"; done

      - name: Session and hook regression checks
        run: |
          python3 tests/check_sessions.py
          python3 tests/check_models.py
          node --check site/preview.js

      - name: Rebuild frames from sprite.js
        run: node build.js

      - name: Bump patch version
        run: |
          set -eu
          current="$(tr -d ' \n' < VERSION)"
          # Strictly x.y.z — each part present and numeric. A malformed VERSION
          # must fail loudly, not be silently reinterpreted.
          case "$current" in
            *.*.*) : ;;
            *) echo "VERSION is not x.y.z: '$current'" >&2; exit 1 ;;
          esac
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              ''|*[!0-9]*) echo "VERSION is not x.y.z: '$current'" >&2; exit 1 ;;
            esac
          done
          printf '%s' "$major.$minor.$((patch + 1))" > VERSION
          echo "Released $(cat VERSION) (was $current)" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh website preview and stable installer
        run: node build-site.js

      - name: Commit and push (with retry)
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION frames preview.png site/preview-data.js site/idle.png site/working.png site/waiting.png site/seated.png site/icon.png site/install.sh
          git commit -m "Release $(cat VERSION)"
          # A docs-only push can land while this runs; rebase and retry rather
          # than losing the release.
          n=0
          until git push; do
            n=$((n + 1))
            [ "$n" -ge 3 ] && { echo "push failed after 3 attempts" >&2; exit 1; }
            git pull --rebase origin main
          done
